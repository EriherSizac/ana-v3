version: 1
applications:
  - appRoot: admin-web
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 20
            - npm ci
        build:
          commands:
            # Las variables solo-servidor del BFF deben existir en runtime de SSR:
            # Amplify expone las variables de la app en el build; se copian a
            # .env.production para que Next.js las lea en el servidor.
            - env | grep -E '^(COGNITO_ALLOWED_CLIENT_IDS|ANA_V4_API_BASE|ANA_V3_API_BASE|ROLES_API_BASE|ROLES_API_KEY|NEXT_PUBLIC_)' >> .env.production
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
