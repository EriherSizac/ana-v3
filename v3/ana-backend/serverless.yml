# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: pernexium
# "service" is the name of this project. This will also be added to your AWS resource names.
service: ana-backend
params:
  dev:
    domain: ana-dev.pernexium.com.mx
  prod:
    domain: ana-prod.pernexium.com.mx

build:
  esbuild: true

provider:
  name: aws
  runtime: nodejs20.x
  profile: pernexium
  domain: ${param:domain}
  # Uncomment to easily set up a custom domain. Read the docs for more details:
  # https://www.serverless.com/framework/docs/providers/aws/guide/domains
  # domain: api.example.com
  httpApi:
    cors:
      allowedOrigins:
        - '*'
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PATCH
        - PUT
        - DELETE
        - OPTIONS
  environment:
    BUCKET_NAME: ${self:service}-storage-${sls:stage}
    ANA_API_URL: https://ow24p7ablb.execute-api.us-east-1.amazonaws.com
    TEMPLATES_BUCKET: s3-motor-509399624341-prod
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:ListBucket
            - s3:DeleteObject
          Resource:
            - arn:aws:s3:::${self:service}-storage-${sls:stage}/*
            - arn:aws:s3:::${self:service}-storage-${sls:stage}
            - arn:aws:s3:::s3-motor-509399624341-prod
            - arn:aws:s3:::s3-motor-509399624341-prod/templates/*

functions:
  hello:
    handler: handler.hello
    events:
      - httpApi:
          path: /
          method: get
          cors: true

  uploadBackup:
    handler: src/handlers/backups.uploadBackup
    events:
      - httpApi:
          cors: true
          path: /backups
          method: post

  backupsOptions:
    handler: src/handlers/backups.optionsHandler
    events:
      - httpApi:
          cors: true
          path: /backups
          method: options

  getLatestBackup:
    handler: src/handlers/backups.getLatestBackup
    events:
      - httpApi:
          cors: true
          path: /backups/latest/{agentId}/{campaign}
          method: get

  backupsLatestOptions:
    handler: src/handlers/backups.optionsHandler
    events:
      - httpApi:
          cors: true
          path: /backups/latest/{agentId}/{campaign}
          method: options

  saveChatBackup:
    handler: src/handlers/chatBackups.saveChatBackup
    events:
      - httpApi:
          cors: true
          path: /backups/chat
          method: post

  chatBackupsOptions:
    handler: src/handlers/chatBackups.optionsHandler
    events:
      - httpApi:
          cors: true
          path: /backups/chat
          method: options

  getChatBackup:
    handler: src/handlers/chatBackups.getChatBackup
    events:
      - httpApi:
          cors: true
          path: /backups/chat/{campaign}/{agentId}/{contactPhone}
          method: get

  getChatBackupOptions:
    handler: src/handlers/chatBackups.optionsHandler
    events:
      - httpApi:
          cors: true
          path: /backups/chat/{campaign}/{agentId}/{contactPhone}
          method: options

  listChatBackups:
    handler: src/handlers/chatBackups.listChatBackups
    events:
      - httpApi:
          cors: true
          path: /backups/chats/{campaign}/{agentId}
          method: get

  listChatBackupsOptions:
    handler: src/handlers/chatBackups.optionsHandler
    events:
      - httpApi:
          cors: true
          path: /backups/chats/{campaign}/{agentId}
          method: options

  getChats:
    handler: src/handlers/chats.getChats
    events:
      - httpApi:
          path: /get/chats/{agentId}/{campaignId}
          method: get
          cors: true

  chatsOptions:
    handler: src/handlers/chats.optionsHandler
    events:
      - httpApi:
          path: /get/chats/{agentId}/{campaignId}
          method: options
          cors: true

  uploadMedia:
    handler: src/handlers/media.uploadMedia
    events:
      - httpApi:
          path: /media
          method: post
          cors: true

  mediaOptions:
    handler: src/handlers/media.optionsHandler
    events:
      - httpApi:
          path: /media
          method: options
          cors: true

  updatePendingContacts:
    handler: src/handlers/contacts.updatePendingContacts
    events:
      - httpApi:
          path: /contacts/pending
          method: post
          cors: true

  contactsOptions:
    handler: src/handlers/contacts.optionsHandler
    events:
      - httpApi:
          path: /contacts/pending
          method: options
          cors: true

  verifyCredentials:
    handler: src/handlers/auth.verifyCredentials
    events:
      - httpApi:
          path: /auth/verify
          method: post
          cors: true

  authOptions:
    handler: src/handlers/auth.optionsHandler
    events:
      - httpApi:
          path: /auth/verify
          method: options
          cors: true

  # Supervisores - Cargar datos de agentes
  uploadAgentContacts:
    handler: src/handlers/supervisors.uploadAgentContacts
    events:
      - httpApi:
          path: /supervisors/agents/{agent}/{campaign}/contacts
          method: post
          cors: true

  getAgentContacts:
    handler: src/handlers/supervisors.getAgentContacts
    events:
      - httpApi:
          path: /supervisors/agents/{agent}/{campaign}/contacts
          method: get
          cors: true

  supervisorsContactsOptions:
    handler: src/handlers/supervisors.optionsHandler
    events:
      - httpApi:
          path: /supervisors/agents/{agent}/{campaign}/contacts
          method: options
          cors: true

  # Supervisores - Consultar asignaciones (assignments)
  listAgentAssignments:
    handler: src/handlers/supervisors.listAgentAssignments
    events:
      - httpApi:
          path: /supervisors/assignments/agents/{agent}/{campaign}
          method: get
          cors: true

  getAgentAssignments:
    handler: src/handlers/supervisors.getAgentAssignments
    events:
      - httpApi:
          path: /supervisors/assignments/agents/{agent}/{campaign}/contacts
          method: get
          cors: true

  supervisorsAssignmentsOptions:
    handler: src/handlers/supervisors.optionsHandler
    events:
      - httpApi:
          path: /supervisors/assignments/agents/{agent}/{campaign}
          method: options
          cors: true
      - httpApi:
          path: /supervisors/assignments/agents/{agent}/{campaign}/contacts
          method: options
          cors: true

  # Agentes - Publicar selección final hacia key legacy/deprecated
  publishAgentContactsDeprecated:
    handler: src/handlers/supervisors.publishAgentContactsDeprecated
    events:
      - httpApi:
          path: /agents/{agent}/{campaign}/contacts
          method: post
          cors: true

  agentsPublishContactsOptions:
    handler: src/handlers/supervisors.optionsHandler
    events:
      - httpApi:
          path: /agents/{agent}/{campaign}/contacts
          method: options
          cors: true

  # Supervisores - Descargar archivo(s) por S3 key(s)
  downloadFilesByKey:
    handler: src/handlers/supervisors.downloadFilesByKey
    events:
      - httpApi:
          path: /supervisors/files/download
          method: post
          cors: true

  supervisorsFilesDownloadOptions:
    handler: src/handlers/supervisors.optionsHandler
    events:
      - httpApi:
          path: /supervisors/files/download
          method: options
          cors: true

  # Credenciales por campaña
  getCampaignCredentials:
    handler: src/handlers/credentials.getCampaignCredentials
    events:
      - httpApi:
          path: /credentials/{campaign}
          method: get
          cors: true

  credentialsGetOptions:
    handler: src/handlers/credentials.optionsHandler
    events:
      - httpApi:
          path: /credentials/{campaign}
          method: options
          cors: true

  uploadCampaignCredentials:
    handler: src/handlers/credentials.uploadCampaignCredentials
    events:
      - httpApi:
          path: /credentials/upload
          method: post
          cors: true

  credentialsUploadOptions:
    handler: src/handlers/credentials.optionsHandler
    events:
      - httpApi:
          path: /credentials/upload
          method: options
          cors: true

  regenerateDailyPasswords:
    handler: src/handlers/credentials.regenerateDailyPasswords
    events:
      - httpApi:
          path: /credentials/regenerate
          method: post
          cors: true

  credentialsRegenerateOptions:
    handler: src/handlers/credentials.optionsHandler
    events:
      - httpApi:
          path: /credentials/regenerate
          method: options
          cors: true

  # Templates de campaña (S3: s3-motor-509399624341-prod)
  getTemplates:
    handler: src/handlers/templates.getTemplates
    events:
      - httpApi:
          path: /templates
          method: get
          cors: true

  putTemplate:
    handler: src/handlers/templates.putTemplate
    events:
      - httpApi:
          path: /templates
          method: post
          cors: true

  templatesOptions:
    handler: src/handlers/templates.optionsHandler
    events:
      - httpApi:
          path: /templates
          method: options
          cors: true

resources:
  Resources:
    StorageBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:service}-storage-${sls:stage}
